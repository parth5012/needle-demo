[project]
name = "needle-demo-backend"
version = "0.1.0"
description = "Needle 3 Text-to-Form Backend with Local Inference Engine for Artify Bharat"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "cactus-needle>=3.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

